        custom: []
        status: 200
        content: |-
          {
            "data": {
              "total_properties": 2,
              "total_monthly_income": "2500.00",
              "total_expected_annual_income": "30000.00",
              "total_deposits_held": "4250.00",
              "contracts_expiring": 1,
