name: 'Business Logic'
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: 'api/v1/users/{uuid}/financial-summary'
    metadata:
      custom: []
      groupName: 'Business Logic'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Get the financial summary for a user.'
      description: |-
        Returns a property-by-property financial breakdown for the given user,
        plus top-level aggregated totals. Only active and finalized contracts are
        included — draft contracts are excluded because they represent future
        intent rather than real income.

        Admins can request the summary of any user.
        Regular users can only request their own summary.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      uuid:
        custom: []
        name: uuid
        description: 'The UUID of the user.'
        required: true
        example: 9d4e7c8b-a5f2-4e1d-8c3b-2f7e4a9d1c5e
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      uuid: 9d4e7c8b-a5f2-4e1d-8c3b-2f7e4a9d1c5e
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
